name: Mantener App Activa

on:
  schedule:
    - cron: '0 */6 * * *'  # Ejecuta cada 6 horas
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la app de Streamlit
        run: |
          curl -s -L --max-redirs 5 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://confesionario-shisqueic.streamlit.app/" > /dev/null || true
